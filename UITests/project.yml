name: UITestHarness
options:
  bundleIdPrefix: com.tmp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  DummyHost:
    type: application
    platform: iOS
    sources: [DummyHost]
    info:
      path: DummyHost/Info.plist
      properties:
        CFBundleDisplayName: UITestHarness
  StartQuizUITest:
    type: bundle.ui-testing
    platform: iOS
    sources: [StartQuizUITest]
    dependencies:
      - target: DummyHost
schemes:
  UITestHarness:
    build:
      targets:
        DummyHost: [run]
        StartQuizUITest: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StartQuizUITest
