name: IQTest
options:
  bundleIdPrefix: com.iqtest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  IQTest:
    type: application
    platform: iOS
    sources:
      - path: IQTest
    info:
      path: IQTest/Info.plist
      properties:
        CFBundleDisplayName: 智商测试
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
